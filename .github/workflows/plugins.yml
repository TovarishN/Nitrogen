name: Plugins

# Builds Nitrogen and the VS Code and Rider plugins with ./build.sh and publishes them as
# build artifacts, and, for a v* tag, attaches them to the tag's GitHub release. Separate from CI
# because it downloads the Rider SDK and takes minutes.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# PR branches run through pull_request; only main also runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # Rider 2026.2 runs on Java 25; the IntelliJ Platform Gradle plugin compiles with a matching toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      - run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}" ./build.sh
          else
            ./build.sh
          fi
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: plugin-test-diagnostics
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: nitrogen-plugins
          path: |
            artifacts/build-info.json
            artifacts/*.vsix
            artifacts/rider/*.zip
          if-no-files-found: error

  # For a v* tag, attaches the plugins to the tag's GitHub release, drafting it if the Packages workflow hasn't.
  release:
    if: github.ref_type == 'tag'
    needs: plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: nitrogen-plugins
          path: release
      - run: eng/release-draft.sh "$GITHUB_REF_NAME" $(find release -type f -name '*.vsix' -o -type f -name '*.zip' | sort)
        env:
          GH_TOKEN: ${{ github.token }}
