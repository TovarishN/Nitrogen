name: Plugins

# Builds Nitrogen and the VS Code and Rider plugins with ./build.sh and publishes them as
# build artifacts. Separate from CI because it downloads the Rider SDK and takes minutes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "build.sh"
      - "editors/**"
      - "Nitrogen.Cli/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nitrogen-plugins
          path: |
            artifacts/*.vsix
            artifacts/rider/*.zip
          if-no-files-found: error
