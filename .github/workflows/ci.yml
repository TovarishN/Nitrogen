name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# PR branches run through pull_request; only main also runs on push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: python3 eng/test-build-identity.py
      - run: dotnet build Nitrogen.slnx -warnaserror
      - run: dotnet Nitrogen.Cli/bin/Debug/net10.0/nitrogen.dll --version
      - timeout-minutes: 4
        run: >-
          dotnet test Nitrogen.Tests/Nitrogen.Tests.csproj --no-build
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini
          --logger "console;verbosity=normal" --logger trx --results-directory TestResults
          --diag TestResults/vstest.log
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: dotnet-test-diagnostics
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: eng/check-links.py

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: eng/package-smoke.sh
